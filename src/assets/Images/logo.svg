<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Neon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
  </defs>

  <!-- Outer Faint Circle Guide (Optional - standard logo framing) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.25" />

  <!-- Main 'A' Lines with Glow -->
  <g filter="url(#glow)">
    <!-- Left Leg -->
    <line x1="256" y1="90" x2="150" y2="390" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Right Leg -->
    <line x1="256" y1="90" x2="362" y2="390" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Top Apex Node -->
    <circle cx="256" cy="90" r="16" fill="#00f3ff" />
    
    <!-- Bottom Left Node -->
    <circle cx="150" cy="390" r="14" fill="#00f3ff" />
    
    <!-- Bottom Right Node -->
    <circle cx="362" cy="390" r="14" fill="#00f3ff" />

    <!-- Inner Mid-point Nodes -->
    <circle cx="204" cy="280" r="10" fill="#00f3ff" />
    <circle cx="308" cy="280" r="10" fill="#00f3ff" />
  </g>
</svg>
